name: Publicar en GitHub Pages

on:
  # `dev` y los PR hacia `main` solo verifican. Publicar es exclusivo de `main`,
  # y a `main` no se llega sino por un PR verde: esa es toda la regla.
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  # La traza del encabezado se calcula al construir, así que sin una
  # reconstrucción periódica se congelaría. Una vez al día basta: el calendario
  # de contribuciones de GitHub no cambia más seguido que eso.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Solo lectura por defecto. El permiso de escribir en Pages vive en el job que
# publica, no en todo el workflow: verificar un PR —código que todavía no ha
# pasado por ninguna puerta— no tiene por qué poder tocar el sitio en vivo.
permissions:
  contents: read

# Una verificación viva por rama. En un PR se cancela la anterior: empujar tres
# correcciones seguidas no debería ocupar tres runners para que dos respuestas
# lleguen ya obsoletas. En `main` no se cancela, porque ese run termina en un
# despliegue y abortarlo a medias es peor que esperarlo.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # OJO: este nombre es el contexto exacto que la protección de `main` exige
    # para dejar mergear. Renombrarlo sin actualizar la regla deja los PR
    # bloqueados para siempre esperando un check que ya no reporta nadie.
    name: Verificar y construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install` y no `npm ci`: el lock se genera en macOS y no puede
      # contener los binarios opcionales por plataforma que npm resuelve en
      # Linux (sharp, el resolutor de eslint). `npm ci` exige un lock que los
      # cubra todos y falla; `npm install` respeta las versiones fijadas y
      # baja además el binario que le toca al runner.
      - run: npm install --no-audit --no-fund

      - name: Tipos, lint y pruebas
        run: |
          npx tsc --noEmit
          npx eslint src
          npm test

      # El build corre también en los PR aunque no se publique: `tsc` no ve los
      # errores que solo aparecen al exportar estático (una ruta dinámica, un
      # `cookies()` colado). Sin este paso, la puerta dejaría pasar un cambio
      # que rompe el despliegue justo después de mergear.
      - name: Construir el sitio estático
        env:
          # Si falla o falta, `getActivity()` cae al snapshot versionado y lo
          # rotula con su fecha. El sitio nunca se queda sin gráfica.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY }}
        run: npm run build

      # Subir el artefacto solo cuando va a publicarse. En un PR, `github.ref`
      # es `refs/pull/N/merge`, así que esta condición ya lo excluye sin
      # necesidad de mirar el evento.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: out

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Un despliegue a la vez, y este sí es global: dos publicaciones simultáneas
    # compiten por el mismo sitio. No se cancela la que esté en curso,
    # interrumpir una publicación a medias deja el sitio en un estado peor que
    # esperar.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
